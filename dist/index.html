<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>AI Intelligence Hub</title>
  <style>
    :root { --bg: #07111f; --panel: #111d33; --text: #e5eefc; --accent: #38bdf8; }
    body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    .nav { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab { padding: 10px 20px; cursor: pointer; border-radius: 8px; border: 1px solid #333; }
    .tab.active { background: var(--accent); color: #000; }
    .view { display: none; }
    .view.active { display: block; }
    .card { background: var(--panel); padding: 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #222; }
  </style>
</head>
<body>
  <div class="nav">
    <div class="tab active" onclick="switchView(this, 'copilot')">Copilot</div>
    <div class="tab" onclick="switchView(this, 'openai')">OpenAI</div>
    <div class="tab" onclick="switchView(this, 'anthropic')">Anthropic</div>
    <div class="tab" onclick="switchView(this, 'google')">Google</div>
  </div>
  <div id="copilot" class="view active"></div>
  <div id="openai" class="view"></div>
  <div id="anthropic" class="view"></div>
  <div id="google" class="view"></div>

  <script>
    function switchView(el, id) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      el.classList.add('active');
    }
    
    async function loadNews() {
      const res = await fetch('updates.json?t=' + Date.now());
      const data = await res.json();
        data.forEach(item => {
        // Mapp kategori til ID - Vi gør det case-insensitive
        const cat = (item.category || "").toLowerCase();
        let targetId = 'copilot';
        if (cat.includes('openai')) targetId = 'openai';
        else if (cat.includes('anthropic')) targetId = 'anthropic';
        else if (cat.includes('google')) targetId = 'google';
        
        const target = document.getElementById(targetId);
        if (target) {
          target.innerHTML += `<div class="card"><h3>${item.title}</h3><a href="${item.link}" target="_blank">Læs mere</a></div>`;
        }
    });
    }
    loadNews();
  </script>
</body>
</html>
