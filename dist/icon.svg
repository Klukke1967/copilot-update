<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="copilot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="claude" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="chatgpt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10a37f"/>
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#cbd5e1" stroke-width="8"/>
  
  <!-- Three connected AI nodes / orbits -->
  <!-- Center hub -->
  <circle cx="256" cy="256" r="44" fill="#1e293b"/>
  <circle cx="256" cy="256" r="24" fill="#ffffff"/>
  
  <!-- Connecting lines -->
  <line x1="256" y1="256" x2="256" y2="130" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="146" y2="340" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="366" y2="340" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Copilot (Top: Blue) -->
  <circle cx="256" cy="130" r="54" fill="url(#copilot)" filter="drop-shadow(0 6px 12px rgba(2,132,199,0.3))"/>
  <path d="M242 120 L270 120 M256 106 L256 134 M244 144 L268 144" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Claude (Bottom Left: Terracotta) -->
  <circle cx="146" cy="340" r="54" fill="url(#claude)" filter="drop-shadow(0 6px 12px rgba(217,119,6,0.3))"/>
  <circle cx="146" cy="340" r="22" fill="none" stroke="#ffffff" stroke-width="6"/>
  <circle cx="146" cy="340" r="8" fill="#ffffff"/>
  
  <!-- ChatGPT (Bottom Right: Emerald Green) -->
  <circle cx="366" cy="340" r="54" fill="url(#chatgpt)" filter="drop-shadow(0 6px 12px rgba(16,163,127,0.3))"/>
  <!-- Spiral/flower motif -->
  <path d="M354 330 C358 324, 374 324, 378 330 C382 336, 378 350, 366 354 C354 350, 350 336, 354 330 Z" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
</svg>
