<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Intelligence Hub</title>
  <style>
    :root { --bg: #07111f; --panel: #111d33; --text: #e5eefc; --accent: #38bdf8; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .nav { display: flex; gap: 15px; margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .tab { padding: 10px 20px; cursor: pointer; border-radius: 8px; font-weight: bold; }
    .tab.active { background: var(--accent); color: #000; }
    .card { background: var(--panel); padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #222; }
    h2 { margin-top: 0; color: var(--accent); }
    #chat-box { height: 400px; overflow-y: scroll; background: #07111f; padding: 15px; border-radius: 8px; border: 1px solid #333; }
  </style>
</head>
<body>
  <div class="nav">
    <div class="tab active" onclick="switchTab(this, 'copilot')">Copilot</div>
    <div class="tab" onclick="switchTab(this, 'chat')">Chat med Hermes</div>
  </div>

  <div id="copilot" class="view">
    <div id="updates">Henter nyheder via Qwen...</div>
  </div>

  <div id="chat" class="view" style="display:none;">
    <div id="chat-box"></div>
    <div style="margin-top: 10px;">
      <input type="text" id="msg" style="width: 80%; padding: 10px;" placeholder="Skriv besked...">
      <button onclick="sendMsg()">Send</button>
    </div>
  </div>

  <script>
    function switchTab(el, id) {
      document.querySelectorAll('.view').forEach(v => v.style.display = 'none');
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(id).style.display = 'block';
      el.classList.add('active');
    }
    
    async function loadNews() {
      const res = await fetch('updates.json?t=' + Date.now());
      const data = await res.json();
      const container = document.getElementById('updates');
      container.innerHTML = data.map(item => `
        <div class="card">
          <h2>${item.title}</h2>
          <p>${item.summary || 'Ingen opsummering tilgængelig'}</p>
          <a href="${item.link}" target="_blank">Læs mere</a>
        </div>
      `).join('');
    }
    
    loadNews();
  </script>
</body>
</html>
