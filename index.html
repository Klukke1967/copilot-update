<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Intelligence Hub</title>
  <style>
    :root { --bg: #07111f; --panel: #0c1729; --text: #e5eefc; --accent: #38bdf8; }
    body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab { padding: 10px 20px; cursor: pointer; border: 1px solid #333; border-radius: 8px; }
    .tab.active { background: var(--accent); color: #000; }
    .content { display: none; }
    .content.active { display: block; }
    #updates { display: grid; gap: 12px; margin-top: 10px; }
    .update { padding: 16px; border-radius: 18px; border: 1px solid #333; background: #0c1729; }
    #chat-box { height: 300px; overflow-y: scroll; border: 1px solid #333; padding: 10px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>AI Intelligence Hub</h1>
  <div class="tabs">
    <div class="tab active" onclick="showTab('Copilot')">Copilot</div>
    <div class="tab" onclick="showTab('Chat')">Chat med Hermes</div>
  </div>
  
  <div id="Copilot" class="content active">
    <div id="updates">Henter nyheder...</div>
  </div>
  <div id="Chat" class="content">
    <div id="chat-box"></div>
    <input type="text" id="msg" placeholder="Skriv til Hermes...">
    <button onclick="sendMsg()">Send</button>
  </div>

  <script src="app.js"></script>
  <script>
    function showTab(name) {
      document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(name).classList.add('active');
      event.target.classList.add('active');
    }
    async function sendMsg() {
      const msg = document.getElementById('msg').value;
      const box = document.getElementById('chat-box');
      box.innerHTML += `<div><b>Dig:</b> ${msg}</div>`;
      box.innerHTML += `<div><b>Hermes:</b> Modtaget! (Backend forbindes i morgen)</div>`;
    }
  </script>
</body>
</html>
