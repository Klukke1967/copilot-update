<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Intelligence Hub</title>
  <style>
    :root { --bg: #07111f; --panel: #0c1729; --text: #e5eefc; --accent: #38bdf8; }
    body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab { padding: 10px 20px; cursor: pointer; border: 1px solid #333; border-radius: 8px; }
    .tab.active { background: var(--accent); color: #000; }
    .content { display: none; }
    .content.active { display: block; }
  </style>
</head>
<body>
  <h1>AI Intelligence Hub</h1>
  <div class="tabs">
    <div class="tab active" onclick="showTab('Copilot')">Copilot</div>
    <div class="tab" onclick="showTab('Generel AI')">Generel AI</div>
    <div class="tab" onclick="showTab('Google AI')">Google AI</div>
  </div>
  <div id="Copilot" class="content active"></div>
  <div id="Generel AI" class="content"></div>
  <div id="Google AI" class="content"></div>
  <script>
    function showTab(name) {
      document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(name).classList.add('active');
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
