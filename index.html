<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Copilot Dashboard</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#0ea5e9" />
  <style>
    :root {
      --bg: #07111f;
      --panel: #0c1729;
      --panel-2: #111d33;
      --text: #e5eefc;
      --muted: #97a7c1;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --warn: #fbbf24;
      --border: rgba(148, 163, 184, 0.2);
      --shadow: 0 20px 60px rgba(0,0,0,.24);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: radial-gradient(circle at top, #10213d 0, var(--bg) 45%); color: var(--text); font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    body { padding: 20px; }
    .wrap { max-width: 1120px; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .logo { width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; box-shadow: var(--shadow); font-size: 24px; }
    h1 { margin: 0; font-size: clamp(1.6rem, 3vw, 2.4rem); line-height: 1.05; }
    .subtitle { color: var(--muted); margin-top: 4px; font-size: 0.95rem; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn { appearance: none; border: 1px solid var(--border); background: rgba(15,23,42,.8); color: var(--text); padding: 10px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; transition: .2s ease; }
    .btn:hover { transform: translateY(-1px); border-color: rgba(56,189,248,.6); }
    .btn.primary { background: linear-gradient(135deg, rgba(56,189,248,.2), rgba(34,197,94,.18)); }
    .toast { display: none; margin: 0 0 18px; border: 1px solid rgba(251,191,36,.35); background: rgba(251,191,36,.12); color: #fff4c3; padding: 12px 14px; border-radius: 16px; box-shadow: var(--shadow); }
    .toast button { margin-left: 8px; border: 0; border-radius: 999px; background: var(--warn); color: #1b1b1b; padding: 7px 12px; font-weight: 800; cursor: pointer; }
    main { display: grid; grid-template-columns: 1.5fr .9fr; gap: 18px; align-items: start; }
    section, .card { border: 1px solid var(--border); background: linear-gradient(180deg, rgba(17,29,51,.96), rgba(12,23,41,.95)); border-radius: 22px; box-shadow: var(--shadow); }
    section { padding: 18px; }
    .section-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .section-title h2 { margin: 0; font-size: 1.05rem; }
    .badge { font-size: .78rem; color: #bfe9ff; border: 1px solid rgba(56,189,248,.35); background: rgba(56,189,248,.1); border-radius: 999px; padding: 6px 10px; }
    .updates { display: grid; gap: 12px; }
    .update { padding: 16px; border-radius: 18px; border: 1px solid var(--border); background: rgba(3, 7, 18, .18); }
    .update h3 { margin: 0 0 8px; font-size: 1.02rem; }
    .meta { display: flex; flex-wrap: wrap; gap: 10px; color: var(--muted); font-size: .86rem; margin-bottom: 10px; }
    .update p { margin: 0; color: #dce7f9; line-height: 1.5; }
    .source-list { display: grid; gap: 12px; }
    .source-item { padding: 14px 16px; border-radius: 18px; border: 1px solid var(--border); background: rgba(3, 7, 18, .2); }
    .source-item strong { display: block; margin-bottom: 6px; }
    .source-item a { color: #8bdcff; text-decoration: none; }
    .source-item a:hover { text-decoration: underline; }
    .empty { color: var(--muted); padding: 18px; text-align: center; border: 1px dashed rgba(148,163,184,.28); border-radius: 18px; }
    footer { margin-top: 18px; color: var(--muted); font-size: .84rem; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    @media (max-width: 880px) { main { grid-template-columns: 1fr; } header { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo">☁</div>
        <div>
          <h1>Copilot Dashboard</h1>
          <div class="subtitle">Alt vi sætter op samles her — tilgængelig fra enhver enhed.</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn primary" id="reloadBtn">🔄 Genindlæs</button>
        <button class="btn" id="refreshBtn">Opdater data</button>
      </div>
    </header>

    <div id="toast" class="toast">
      🚀 Ny opdatering klar!
      <button id="updateNowBtn">Opdater nu</button>
    </div>

    <main>
      <section>
        <div class="section-title">
          <h2>Seneste Copilot-nyt</h2>
          <span class="badge" id="lastChecked">Checker…</span>
        </div>
        <div id="updates" class="updates"></div>
      </section>

      <section>
        <div class="section-title">
          <h2>Kilder</h2>
          <span class="badge">RSS</span>
        </div>
        <div id="sources" class="source-list"></div>
      </section>
    </main>

    <footer>
      <div id="buildInfo">Bygget: —</div>
      <div>GitHub Pages · PWA · Network-first navigation</div>
    </footer>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
